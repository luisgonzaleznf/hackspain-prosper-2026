[project]
name = "agent-app"
version = "0.1.0"
description = "Runnable FastAPI tool-calling agent starter (hack-kit template)"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",   # required by fastapi.testclient
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
