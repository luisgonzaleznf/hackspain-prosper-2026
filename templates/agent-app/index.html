<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>hack-kit · agent</title>
    <style>
      :root {
        --bg: #0f1117;
        --panel: #171a23;
        --line: #262b38;
        --text: #e7e9ee;
        --muted: #8b91a1;
        --accent: #6c8cff;
        --user: #233056;
        --tool: #1d2a1f;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        display: flex;
        justify-content: center;
      }
      main {
        width: min(720px, 100%);
        height: 100vh;
        display: flex;
        flex-direction: column;
        padding: 16px;
      }
      header {
        display: flex;
        align-items: baseline;
        gap: 10px;
        padding: 4px 6px 14px;
        border-bottom: 1px solid var(--line);
      }
      header h1 { font-size: 17px; margin: 0; }
      header span { color: var(--muted); font-size: 13px; }
      #log {
        flex: 1;
        overflow-y: auto;
        padding: 16px 4px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .msg { max-width: 85%; padding: 10px 13px; border-radius: 12px; white-space: pre-wrap; word-wrap: break-word; }
      .user { align-self: flex-end; background: var(--user); }
      .bot { align-self: flex-start; background: var(--panel); border: 1px solid var(--line); }
      .tool {
        align-self: flex-start;
        background: var(--tool);
        border: 1px solid var(--line);
        font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: var(--muted);
        max-width: 85%;
        padding: 8px 11px;
        border-radius: 10px;
      }
      .tool b { color: var(--accent); }
      form { display: flex; gap: 8px; padding-top: 12px; border-top: 1px solid var(--line); }
      input {
        flex: 1;
        background: var(--panel);
        border: 1px solid var(--line);
        color: var(--text);
        padding: 11px 13px;
        border-radius: 10px;
        font-size: 15px;
      }
      input:focus { outline: 1px solid var(--accent); }
      button {
        background: var(--accent);
        color: #0b0d12;
        border: 0;
        padding: 0 18px;
        border-radius: 10px;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled { opacity: 0.5; cursor: default; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>hack-kit agent</h1>
        <span>tool-calling demo · Anthropic</span>
      </header>
      <div id="log"></div>
      <form id="form">
        <input id="input" autocomplete="off" placeholder="Ask something…" />
        <button id="send" type="submit">Send</button>
      </form>
    </main>

    <script>
      const log = document.getElementById("log");
      const form = document.getElementById("form");
      const input = document.getElementById("input");
      const send = document.getElementById("send");

      function bubble(text, cls) {
        const el = document.createElement("div");
        el.className = "msg " + cls;
        el.textContent = text;
        log.appendChild(el);
        log.scrollTop = log.scrollHeight;
        return el;
      }

      function toolBubble(step) {
        const el = document.createElement("div");
        el.className = "tool";
        el.innerHTML =
          "<b>🔧 " +
          step.name +
          "</b>(" +
          JSON.stringify(step.input) +
          ") → " +
          step.result;
        log.appendChild(el);
        log.scrollTop = log.scrollHeight;
      }

      async function ask(message) {
        bubble(message, "user");
        send.disabled = true;
        const thinking = bubble("…", "bot");
        try {
          const res = await fetch("/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message }),
          });
          const data = await res.json();
          (data.steps || []).forEach(toolBubble);
          thinking.textContent = data.reply || "(no reply)";
        } catch (err) {
          thinking.textContent = "Error: " + err;
        } finally {
          send.disabled = false;
          input.focus();
        }
      }

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        const message = input.value.trim();
        if (!message) return;
        input.value = "";
        ask(message);
      });

      // Seed the demo prompt so the golden path is one click away.
      fetch("/health")
        .then((r) => r.json())
        .then((h) => {
          if (h.demo_prompt) input.value = h.demo_prompt;
        })
        .catch(() => {});
    </script>
  </body>
</html>
