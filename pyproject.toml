[project]
name = "hack-kit"
version = "0.1.0"
description = "A template for shipping a real, AI-first app fast at a hackathon — local-only, Python-first."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Ship the helper package; the per-hackathon `app/` is created on demand.
packages = ["lib"]

# ── ruff ────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["lib", "app", "scripts", "tests"]

[tool.ruff.lint]
# Keep it pragmatic for hackathon speed, but catch real bugs.
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",  # line length is handled by the formatter, don't fail builds on it
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
"scripts/*" = ["T201"]  # prints are intentional in scripts

# ── mypy ────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
files = ["lib", "app", "scripts"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
# Hackathon-pragmatic: don't block on missing annotations in fast-moving code.
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["tests.*"]
ignore_errors = true

# ── pytest ──────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
